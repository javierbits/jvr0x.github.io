name: repobeagle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  scan:
    permissions:
      contents: write   # publishes the repobeagle badge branch
      statuses: write   # sets the repobeagle/scan commit status
      id-token: write   # keyless-signs the report with Sigstore
    uses: jvr0x/repobeagle/.github/workflows/scan.yml@main
    with:
      profile: balanced
